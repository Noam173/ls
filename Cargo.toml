[package]
name = "ls"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
jwalk = "0.8.1"
rustc-hash = "2.1.3"
users = "0.11.0"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
